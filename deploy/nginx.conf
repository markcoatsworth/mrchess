server {
    listen __PORT__;
    root /var/www/mrchess;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    location / {
        try_files $uri $uri/ =404;
    }

    # The move engine: one native process per request, via fcgiwrap
    location = /cgi-bin/mrchess.cgi {
        gzip off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/cgi-bin/mrchess.cgi;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300s;
    }
}
